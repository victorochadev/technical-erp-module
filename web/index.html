<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Módulo Técnico — ERP BM1/BJControl</title>
<script>
  ;(function() {
    if (sessionStorage.getItem('at-auth') !== 'ok' && localStorage.getItem('at-auth') !== 'ok') { window.location.replace('/login.html'); }
  })()
  ;(function() {
    var saved = localStorage.getItem('at-theme') || 'light'
    document.documentElement.setAttribute('data-theme', saved)
  })()
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
