# Publica o conteúdo de public/ na branch gh-pages sempre que a main muda.
# Antes disso o deploy era manual: commitar na main e depois copiar public/
# para a gh-pages na mão. Publicar na branch (em vez de usar o source
# "GitHub Actions" do Pages) mantém a configuração atual do repositório
# intacta — não é preciso mexer em Settings → Pages.

name: Publicar site

on:
  push:
    branches: [main]
    # Só reconstrói quando o que vai pro ar muda. Alteração em src/, README
    # ou supabase/ não gera deploy.
    paths:
      - 'public/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:        # permite disparar manualmente pela aba Actions

permissions:
  contents: write           # necessário para o GITHUB_TOKEN empurrar na gh-pages

# Dois pushes seguidos não publicam ao mesmo tempo; o mais novo vence.
concurrency:
  group: publicar-site
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar public/ para a gh-pages
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages
          git worktree add ../site -B gh-pages origin/gh-pages

          # Zera o conteúdo antigo para que arquivos removidos de public/
          # também saiam do ar. O .nojekyll fica: é ele que impede o GitHub
          # de processar o site como Jekyll.
          find ../site -mindepth 1 -maxdepth 1 ! -name .git ! -name .nojekyll -exec rm -rf {} +
          cp -r public/. ../site/
          touch ../site/.nojekyll

          cd ../site
          git add -A

          if git diff --cached --quiet; then
            echo "Nada mudou em public/ — nenhuma publicação necessária."
            exit 0
          fi

          git commit -m "Publish public/ from ${GITHUB_SHA}"
          git push origin gh-pages
          echo "Site publicado a partir de ${GITHUB_SHA}"
